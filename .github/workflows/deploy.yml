name: Deploy to GitHub Pages

# 只在 main 分支更新时部署；也可以手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 连续推送时只保留最后一次部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Show tool versions and repo layout
        # 万一某个目录没提交上去，这里能一眼看出来
        run: |
          node --version
          npm --version
          echo '--- repo root ---'
          ls -la
          echo '--- frontend ---'
          ls -la frontend
          echo '--- frontend/public ---'
          ls -la frontend/public
          echo '--- shared/defaults ---'
          ls -la shared/defaults

      - name: Install dependencies
        # 部署只用到前端；跳过 Prisma 的 postinstall，省掉下载引擎的时间
        env:
          PRISMA_SKIP_POSTINSTALL_GENERATE: 'true'
        # package-lock.json 里的 resolved 地址是 registry.npmmirror.com（国内装的依赖），
        # 强制换成官方源，避免 runner 拉不动或超时。
        run: npm ci --registry=https://registry.npmjs.org/ --replace-registry-host=always

      - name: Run stats unit tests
        # 单元测试只是额外的信号，不该挡住部署；失败会在日志里标黄但不中断
        continue-on-error: true
        run: npm run test:stats --workspace frontend

      - name: Build frontend
        # 项目站部署在 https://<用户名>.github.io/<仓库名>/，静态资源必须带这个前缀
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build --workspace frontend

      - name: Setup Pages
        uses: actions/configure-pages@v5
        # 不要加 enablement: true。
        # 通过 API 创建 Pages site 需要仓库管理员权限，而 Actions 自带的
        # GITHUB_TOKEN 没有 —— 加了会直接报
        # "Create Pages site failed. Error: Resource not accessible by integration" 并中断整个 job。
        # 第一次使用前必须在 Settings -> Pages -> Source 选一次 "GitHub Actions"，
        # 之后 configure-pages 就只是读取配置，不再需要额外权限。

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
